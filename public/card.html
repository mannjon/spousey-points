<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anniversary Card</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f3d9de; min-height: 100dvh; }
  /* ---------- anniversary card (same styles as the app) ---------- */
  .cardveil {
    position: fixed; inset: 0; z-index: 90;
    background: rgba(24, 8, 14, 0.55); padding: 18px 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .cardveil-close {
    position: absolute; top: 14px; right: 14px; z-index: 3;
    width: 40px; height: 40px; border-radius: 50%;
    border: 1.5px solid #c92a5e; background: #ffffff; color: #c92a5e;
    font-size: 1.4rem; font-weight: 800; line-height: 1; cursor: pointer;
  }
  .flipcard-scene {
    position: relative; perspective: 2200px;
    width: min(96vw, calc((100dvh - 72px) * 1.5));
  }
  .flipcard {
    position: relative; width: 100%; aspect-ratio: 3 / 2;
    transform-style: preserve-3d; cursor: pointer;
    transition: transform 0.9s cubic-bezier(0.2, 0.7, 0.3, 1);
  }
  .flipcard.flipped { transform: rotateY(180deg); }
  .flipcard-face {
    position: absolute; inset: 0; border-radius: 10px; overflow: hidden;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    box-shadow: 0 18px 44px rgba(120, 50, 70, 0.35);
  }
  .flipcard-face img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .flipcard-back { transform: rotateY(180deg); }
  .hearts-burst { position: absolute; inset: 0; pointer-events: none; }
  .hearts-burst-heart {
    position: absolute; left: 50%; top: 50%; line-height: 1; opacity: 0;
    animation: heartFly 2.1s ease-out forwards; animation-delay: var(--hdl);
  }
  @keyframes heartFly {
    0% { transform: translate(-50%, -50%) translate(0, 0) rotate(0deg); opacity: 1; }
    100% { transform: translate(-50%, -50%) translate(var(--hx), var(--hy)) rotate(var(--hr)); opacity: 0; }
  }
</style>
</head>
<body>
  <div class="cardveil" id="veil" role="dialog" aria-modal="true" aria-label="Anniversary card">
    <button type="button" class="cardveil-close" id="closeBtn" aria-label="Close card">×</button>
    <div class="flipcard-scene">
      <div class="flipcard" id="card" role="button" aria-label="Flip the card over">
        <div class="flipcard-face flipcard-front">
          <img src="/card/front.webp" alt="Anniversary card front">
        </div>
        <div class="flipcard-face flipcard-back">
          <img src="/card/inside.png" alt="Anniversary card inside">
        </div>
      </div>
      <div class="hearts-burst" id="burst" aria-hidden="true" style="display:none"></div>
    </div>
  </div>
<script>
  var HEART_COLORS = ["#e5487c", "#f2729b", "#c92a5e", "#f59bb8", "#d6336c"];
  var card = document.getElementById('card');
  var burst = document.getElementById('burst');
  var veil = document.getElementById('veil');
  var flipped = false;
  var seenInside = false;

  function buildHearts() {
    burst.innerHTML = '';
    for (var i = 0; i < 36; i++) {
      var ang = (i / 36) * Math.PI * 2 + (i % 5) * 0.13;
      var dist = 190 + ((i * 53) % 330);
      var el = document.createElement('span');
      el.className = 'hearts-burst-heart';
      el.textContent = '♥';
      el.style.setProperty('--hx', Math.round(Math.cos(ang) * dist) + 'px');
      el.style.setProperty('--hy', Math.round(Math.sin(ang) * dist * 0.8 - 60) + 'px');
      el.style.setProperty('--hr', (((i * 37) % 170) - 85) + 'deg');
      el.style.setProperty('--hdl', ((i % 7) * 45) + 'ms');
      el.style.fontSize = (16 + ((i * 29) % 26)) + 'px';
      el.style.color = HEART_COLORS[i % HEART_COLORS.length];
      burst.appendChild(el);
    }
  }

  card.addEventListener('click', function () {
    if (!flipped) {
      seenInside = true;
      var burstDone = false;
      try { burstDone = !!localStorage.getItem('anniv-burst-page'); } catch (e) { burstDone = false; }
      if (!burstDone) {
        try { localStorage.setItem('anniv-burst-page', '1'); } catch (e) {}
        buildHearts();
        burst.style.display = 'block';
        setTimeout(function () { burst.style.display = 'none'; }, 2600);
      }
    }
    flipped = !flipped;
    card.classList.toggle('flipped', flipped);
    card.setAttribute('aria-label', flipped ? 'Flip the card back' : 'Flip the card over');
  });

  document.getElementById('closeBtn').addEventListener('click', function () {
    if (seenInside) {
      try { localStorage.setItem('anniv-done-page', '1'); } catch (e) {}
    }
    veil.style.display = 'none';
  });
</script>
</body>
</html>
